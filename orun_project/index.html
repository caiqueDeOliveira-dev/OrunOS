
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Orun OS</title>
      <meta name="description" content="Orun OS — Personal AI desktop assistant with local and cloud model support." />
      <meta name="robots" content="noindex, nofollow" />
      <meta name="theme-color" content="#080000" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black" />
      <meta name="apple-mobile-web-app-title" content="Orun OS" />
      <link rel="apple-touch-icon" href="/icons/icon-192x192.svg" />
      <link rel="manifest" href="/manifest.webmanifest" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <script>
        (function () {
          try {
            var t = localStorage.getItem("orun-theme") || "system";
            var resolved;
            if (t === "dark") resolved = "dark";
            else if (t === "light") resolved = "light";
            else if (t === "schedule") { var h = new Date().getHours(); resolved = (h >= 18 || h < 6) ? "dark" : "light"; }
            else resolved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            document.documentElement.classList.add(resolved);
            document.documentElement.classList.remove(resolved === "dark" ? "light" : "dark");
          } catch (e) {}
        })();
      </script>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
